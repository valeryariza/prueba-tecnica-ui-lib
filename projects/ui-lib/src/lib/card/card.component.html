<article [class]="containerClasses()" [attr.data-elevation]="elevation()">
  <header
    class="flex items-start justify-between gap-4 border-b border-ui-border/60 px-5 py-4"
    [class]="headerClasses()"
    [attr.role]="interactiveHeader() ? 'button' : null"
    [attr.tabindex]="interactiveHeader() ? 0 : null"
    (click)="onHeaderClick()"
    (keydown)="onHeaderKeydown($event)"
  >
    <div class="min-w-0">
      <h2 class="truncate text-lg font-bold leading-tight" [attr.id]="titleId()">{{ title() }}</h2>
      @if (subtitle()) {
        <p class="mt-1 text-sm text-ui-text-muted">{{ subtitle() }}</p>
      }
    </div>
    <div class="shrink-0 empty:hidden" (click)="$event.stopPropagation()">
      <ng-content select="[uiCardHeaderActions]" />
    </div>
  </header>

  <div class="px-5 py-4">
    <ng-content />
  </div>

  <footer class="flex flex-wrap items-center justify-end gap-2 border-t border-ui-border/60 px-5 py-3 empty:hidden">
    <ng-content select="[uiCardFooter]" />
  </footer>
</article>
