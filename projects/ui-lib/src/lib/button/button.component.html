<button
  [type]="type()"
  [class]="classes()"
  [disabled]="!isInteractive()"
  [attr.aria-busy]="loading()"
  [attr.aria-label]="ariaLabel()"
  [attr.data-variant]="variant()"
  (click)="handleClick($event)"
>
  @if (loading()) {
    <ui-spinner [size]="size() === 'lg' ? 'md' : 'sm'" [decorative]="true" data-testid="button-spinner" />
  }
  <ng-content />
  @if (label()) {
    <span>{{ label() }}</span>
  }
</button>
