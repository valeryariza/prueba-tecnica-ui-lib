@if (label()) {
  <label [for]="id" class="mb-1.5 block text-sm font-semibold text-ui-text">{{ label() }}</label>
}

@if (loading()) {
  <div
    class="flex h-11 w-full animate-pulse items-center gap-2 rounded-lg border border-ui-border bg-ui-skeleton/40 px-3 text-sm text-ui-text-muted"
    aria-busy="true"
    data-testid="select-loading"
  >
    <ui-spinner size="sm" label="Cargando opciones" />
    <span>Cargando…</span>
  </div>
} @else {
  <div class="relative">
    <select
      [id]="id"
      [class]="selectClasses()"
      [disabled]="disabled()"
      [attr.aria-invalid]="error() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      (change)="onNativeChange($event)"
    >
      <option value="" disabled [selected]="value() === null">{{ placeholder() }}</option>
      @for (option of options(); track option.value) {
        <option [value]="option.value" [disabled]="option.disabled ?? false" [selected]="option.value === value()">
          {{ option.label }}
        </option>
      }
    </select>
    <svg
      class="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 text-ui-text-muted"
      viewBox="0 0 20 20"
      fill="currentColor"
      aria-hidden="true"
    >
      <path
        fill-rule="evenodd"
        d="M5.23 7.21a.75.75 0 0 1 1.06.02L10 11.06l3.71-3.83a.75.75 0 1 1 1.08 1.04l-4.25 4.39a.75.75 0 0 1-1.08 0L5.21 8.27a.75.75 0 0 1 .02-1.06z"
        clip-rule="evenodd"
      />
    </svg>
  </div>
}

@if (error()) {
  <p [id]="id + '-description'" class="mt-1.5 text-xs font-medium text-ui-danger" role="alert">{{ error() }}</p>
} @else if (hint()) {
  <p [id]="id + '-description'" class="mt-1.5 text-xs text-ui-text-muted">{{ hint() }}</p>
}
